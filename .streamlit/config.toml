dataframeBorderColor = "#C9DAD7"
dataframeHeaderBackgroundColor = "#E7F1EF"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
baseFontSize = 15
headingFontSizes = ["34px", "25px", "20px", "17px", "15px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false

[theme.sidebar]
backgroundColor = "#F2F7F6"
