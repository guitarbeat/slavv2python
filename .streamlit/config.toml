[theme]
base = "light"
primaryColor = "#16796E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F7F6"
textColor = "#17312E"
linkColor = "#12685F"
borderColor = "#C9DAD7"
redColor = "#C94B50"
orangeColor = "#A85D12"
greenColor = "#16796E"
blueColor = "#246B8E"
grayColor = "#617471"
chartCategoricalColors = ["#16796E", "#246B8E", "#C94B50", "#A85D12", "#725A9B", "#617471"]
