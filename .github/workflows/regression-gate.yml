name: Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: regression-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up uv
      uses: astral-sh/setup-uv@v9
      with:
        enable-cache: true
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        uv sync --locked --extra app --extra zarr
        
    - name: Format Check (Ruff)
      run: uv run ruff format --check slavv_python tests
      
    - name: Lint Check (Ruff)
      run: uv run ruff check slavv_python tests
      
    - name: Type Check (Mypy)
      run: uv run mypy
      
    - name: Unit Tests (Pytest)
      run: uv run pytest tests/unit tests/integration/test_paper_profile_ci.py tests/integration/parity/ -m "not slow"
